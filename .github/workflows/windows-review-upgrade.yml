# A private GitLab review payload tests its updater against an already-public
# signed Nightly. No release is published or replaced by this workflow.
name: Windows review updater
run-name: Windows review updater ${{ inputs.review_pipeline_id }} ${{ inputs.review_source_commit }} to ${{ inputs.nightly_version }}
on:
  workflow_dispatch:
    inputs:
      review_version:
        description: Internal review package version (7.4.6), not a replacement stable
        required: true
        type: string
      nightly_version:
        description: Exact already-public signed target Nightly
        required: true
        type: string
      review_source_commit:
        description: Independently verified GitLab review source commit
        required: true
        type: string
      nightly_source_commit:
        description: Independently verified public Nightly source commit
        required: true
        type: string
      review_release_id:
        description: Exact unpublished GitHub transport draft ID
        required: true
        type: string
      review_pipeline_id:
        description: Exact successful protected GitLab review pipeline
        required: true
        type: string
      nightly_pipeline_id:
        description: Exact GitLab pipeline of the public target
        required: true
        type: string
      review_manifest_sha256:
        description: Exact signed review manifest hash
        required: true
        type: string
      nightly_manifest_sha256:
        description: Exact signed public Nightly manifest hash
        required: true
        type: string
# GitHub requires write-level release access to read draft assets. The ephemeral
# token is given only to the downloader; checkout persists no credentials.
permissions:
  contents: write
concurrency:
  group: windows-review-upgrade-${{ inputs.review_release_id }}
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Ayont/AyCode' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: .github/windows-upgrade
    env:
      AYCODE_PROOF_KIND: review-updater
      AYCODE_STABLE_VERSION: ${{ inputs.review_version }}
      AYCODE_NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      AYCODE_STABLE_SOURCE_COMMIT: ${{ inputs.review_source_commit }}
      AYCODE_NIGHTLY_SOURCE_COMMIT: ${{ inputs.nightly_source_commit }}
      AYCODE_STABLE_RELEASE_ID: ${{ inputs.review_release_id }}
      AYCODE_STABLE_PIPELINE_ID: ${{ inputs.review_pipeline_id }}
      AYCODE_NIGHTLY_PIPELINE_ID: ${{ inputs.nightly_pipeline_id }}
      AYCODE_STABLE_MANIFEST_SHA256: ${{ inputs.review_manifest_sha256 }}
      AYCODE_NIGHTLY_MANIFEST_SHA256: ${{ inputs.nightly_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Install only the public blackbox driver
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate package boundaries and the corrected helper architecture
        # The separate diagnostic suite deliberately reproduces the old detached
        # PowerShell failure; it is not a gate for this different launch method.
        run: node --test verify.test.mjs review-transport.test.mjs install-diagnostics.test.mjs launcher-bootstrap.test.mjs ../windows-smoke/download.test.mjs
      - name: Download the exact private review and anonymous public target
        run: node prepare.mjs
        env:
          AYCODE_UPGRADE_ROOT: ${{ runner.temp }}/aycode-review-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
      - name: Observe the real updater, automatic relaunch and persisted project
        run: node run.mjs
        env:
          AYCODE_UPGRADE_ROOT: ${{ runner.temp }}/aycode-review-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
