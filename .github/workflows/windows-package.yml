name: Windows package
run-name: Windows ${{ inputs.release_id }} ${{ inputs.version }} ${{ inputs.source_commit }} ${{ inputs.pipeline_id }} ${{ inputs.manifest_sha256 }}
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact release ID (published or draft)
        required: true
        type: string
      version:
        description: Exact X.Y.Z version
        required: true
        type: string
      source_commit:
        description: Full source commit from the signed release.json
        required: true
        type: string
      pipeline_id:
        description: Source pipeline ID from the signed release.json
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the exact signed SHA256SUMS file
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-package-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Ayont/AyCode' && github.ref == 'refs/heads/main'
    # GitHub requires push-level access even to GET a draft release (read returns 403).
    # This ephemeral token is passed only to the downloader, which has no write API.
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: .github/windows-smoke
    env:
      AYCODE_RELEASE_ID: ${{ inputs.release_id }}
      AYCODE_VERSION: ${{ inputs.version }}
      AYCODE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      AYCODE_PIPELINE_ID: ${{ inputs.pipeline_id }}
      AYCODE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Install only the public test driver
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check verification and redirect handling
        run: npm test
      - name: Download and verify this exact signed release
        run: node download.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AYCODE_SMOKE_ROOT: ${{ runner.temp }}/aycode-windows-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check ZIP, native PowerShell, restart and NSIS installation
        run: node smoke.mjs
        env:
          AYCODE_SMOKE_ROOT: ${{ runner.temp }}/aycode-windows-${{ github.run_id }}-${{ github.run_attempt }}
